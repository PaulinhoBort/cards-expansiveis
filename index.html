<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width,
        initial-scale=1.0"  />
        <link rel="stylesheet" href="style.css" />
        <title> Cards Expansíveis</title>
    </head>
    <body>
    <main class="layout">

        <header class="titulo">
            <h1>Explore o mundo</h1>
            <p>Encontre seu próximo destino.</p>
        </header>

        <div class="container">
            <div class="panel active"
                style="background-image: url('https://viagemalemanha.com/wp-content/uploads/2025/10/POSTS-VA-6-1080-x-1350-px-8.png.webp');">
                <h3>Explore o Mundo</h3>
            </div>

            <div class="panel"
                style="background-image: url('https://www.essemundoenosso.com.br/wp-content/uploads/2016/03/praia-ilhas-botina.jpg');">
                <h3>Praia Paradisíaca</h3>
            </div>

            <div class="panel"
                style="background-image: url('https://consorciomagalu.com.br/wp-content/uploads/2026/09/cidades-mais-frias-do-brasil.jpg');">
                <h3>Cidade no Inverno</h3>
            </div>

            <div class="panel"
                style="background-image: url('https://thumbs.dreamstime.com/b/cloudy-mountains-14770756.jpg');">
                <h3>Montanhas nubladas</h3>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
    
</body>
</html>
